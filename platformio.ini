; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = yolo_uno_servo_sweep

[env:esp-wrover-kit]
platform = espressif32
board = esp-wrover-kit
framework = arduino
upload_speed = 921600
build_type = debug
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = 
	-std=gnu++17
	-DDEBUG
	-DCORE_DEBUG_LEVEL=3
lib_deps = h2zero/NimBLE-Arduino@^2.3.6

; Camera profile: UART2 belongs to camera; force ADCs overlap its GPIOs.
[env:yolo_uno_camera]
extends = env:yolo_uno_s3
build_flags =
    ${env:yolo_uno_s3.build_flags}
    -DCAMERA_ENABLED=1
    -DSCALE_ENABLE_QR=0
    -DSCALE_ENABLE_FORCE=0
; LDF ignores #ifdef, so the servo mains would pull HeightCamera (needs ESP32Servo).
lib_ignore = HeightCamera

; Wiring from AI_Vision_camera.ino: camera TX -> GPIO9; camera RX -> GPIO8.
[env:yolo_uno_camera_lcd]
extends = env:yolo_uno_camera
build_flags =
    ${env:yolo_uno_camera.build_flags}
    -DLCD_ENABLED=1
    -DSCALE_POWER_ENABLED=1
    -DCAMERA_RX_PIN=9
    -DCAMERA_TX_PIN=8
lib_deps =
    ${env:yolo_uno_s3.lib_deps}
    marcoschwartz/LiquidCrystal_I2C@1.1.4

; Temporary scanner: prints all BLE addresses without connecting to a scale.
[env:yolo_uno_ble_scan]
extends = env:yolo_uno_s3
build_src_filter = -<*> +<ble_scanner.cpp>
build_flags =
    ${env:yolo_uno_s3.build_flags}
    -DBLE_SCANNER_MODE=1

; Preflight for on-device inference. This does not run a model or change NVS.
[env:yolo_uno_edge_probe]
extends = env:yolo_uno_s3
build_src_filter = -<*> +<edge_probe.cpp>
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
build_flags =
    ${env:yolo_uno_s3.build_flags}
    -DBOARD_HAS_PSRAM
    -DEDGE_PROBE_MODE=1
lib_deps =

; Servo-tilt height measurement (from HeightMeasure_YoloUNO).
; Pair with pedestrian_detector.py (auto) or manual_height_test.py (manual).
; Pins are GPIO numbers; GPIO5/6 are the values from the original project.
[env:yolo_uno_height_servo]
extends = env:yolo_uno_s3
build_src_filter = -<*> +<height_servo_main.cpp>
build_flags =
    ${env:yolo_uno_s3.build_flags}
    -DHEIGHT_SERVO_MODE=1
    -DHEIGHT_CAMERA_RX_PIN=5
    -DHEIGHT_CAMERA_TX_PIN=6
    -DHEIGHT_SERVO_PIN=2
    -DHEIGHT_PERSON_DISTANCE_CM=100.0f
lib_deps = madhephaestus/ESP32Servo@^3.0.8

; Servo-tilt height + Mi Scale 2 weight + BMI on LCD (src/height_servo_bmi_main.cpp).
; Restored 2026-11-14: this env was lost when platformio.ini was overwritten on 2026-11-10.
; Flags rebuilt from the source (#ifdef/#if) and .pio/libdeps. Build OK 2026-11-14; not tried on hardware.
[env:yolo_uno_height_servo_bmi]
extends = env:yolo_uno_s3
build_src_filter = -<*> +<height_servo_bmi_main.cpp>
build_flags =
    ${env:yolo_uno_s3.build_flags}
    -DHEIGHT_SERVO_BMI_MODE=1
    -DSCALE_ENABLE_QR=0
    -DSCALE_ENABLE_FORCE=0
    -DLCD_ENABLED=1
    -DSCALE_POWER_ENABLED=1
    -DHEIGHT_CAMERA_RX_PIN=5
    -DHEIGHT_CAMERA_TX_PIN=6
    -DHEIGHT_SERVO_PIN=2
    -DHEIGHT_PERSON_DISTANCE_CM=100.0f
lib_deps =
    ${env:yolo_uno_s3.lib_deps}
    marcoschwartz/LiquidCrystal_I2C@1.1.4
    madhephaestus/ESP32Servo@^3.0.8

; Servo SG92R test: type an angle (0..180), c, +, -, sweep, detach in Serial Monitor.
; GPIO10 = servo pin of the Plan 2 sweep (old yolo_uno_height_servo* envs use GPIO2).
[env:yolo_uno_servo_test]
extends = env:yolo_uno_s3
build_src_filter = -<*> +<servo_test.cpp>
build_flags =
    ${env:yolo_uno_s3.build_flags}
    -DSERVO_TEST_MODE=1
    -DSERVO_TEST_PIN=10
lib_deps = madhephaestus/ESP32Servo@^3.0.8

; Plan 2 (team): servo sweeps the camera from servo_bottom to servo_top until the
; whole body is in the frame, height from the servo tilt + box, Mi Scale 2 weight,
; BMI, LCD per phase, result hold. src/app_main.cpp + lib/EdgeSweep.
; Laptop: vision/body_tracker.py sends BOX_x1_y1_x2_y2_conf / NOBODY / MULTI.
; Settings: defaults below / edge_config.h, runtime via usb_viewer.py --configure (NVS).
; No scale-power relay here: GPIO10 is the servo (Plan 2) and the scale must stay
; powered to wake the system over BLE. Added 2026-11-18. Not tried on hardware.
[env:yolo_uno_servo_sweep]
extends = env:yolo_uno_s3
build_src_filter = -<*> +<app_main.cpp>
build_flags =
    ${env:yolo_uno_s3.build_flags}
    -DSERVO_SWEEP_MODE=1
    -DSCALE_ENABLE_QR=0
    -DSCALE_ENABLE_FORCE=0
    -DLCD_ENABLED=1
    -DSCALE_POWER_ENABLED=0
    ; Wiring (GPIO numbers): camera on Grove D5/D6, servo on D7 (Plan 2 contract).
    -DSWEEP_CAMERA_RX_PIN=9
    -DSWEEP_CAMERA_TX_PIN=8
    -DSWEEP_SERVO_PIN=10
    ; First-boot defaults (later overridden by values saved with usb_viewer.py):
    -DSWEEP_BOTTOM_DEG=45.0f
    -DSWEEP_TOP_DEG=135.0f
    -DSWEEP_STEP_DEG=5.0f
    -DSWEEP_LEVEL_DEG=90.0f
    -DSWEEP_DIR=-1
    -DSWEEP_SETTLE_MS=200
    -DSWEEP_FRAME_DELAY_MS=500
    -DSWEEP_HOLD_SEC=12.0f
    -DSWEEP_CAMERA_HEIGHT_CM=110.0f
    -DSWEEP_FOCAL=1.33f
lib_deps =
    ${env:yolo_uno_s3.lib_deps}
    marcoschwartz/LiquidCrystal_I2C@1.1.4
    madhephaestus/ESP32Servo@^3.0.8

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_type = debug
upload_speed = 921600
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = 
	-std=gnu++17
	-DDEBUG
	-DCORE_DEBUG_LEVEL=3
lib_deps = h2zero/NimBLE-Arduino@^2.3.6

[env:yolo_uno_s3]
platform = espressif32
board = yolo_uno
framework = arduino
monitor_speed = 115200
; Framework adds level 0 after project flags; remove it so INFO logs stay on.
build_unflags = -DCORE_DEBUG_LEVEL=0

build_flags = 
	-std=gnu++17
	-DDEBUG
	-DCORE_DEBUG_LEVEL=3
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps = h2zero/NimBLE-Arduino@^2.3.6
; LDF ignores #ifdef: without this, the servo programs pull lib/HeightCamera
; (needs ESP32Servo) into envs that do not install it. Servo envs set their own filter.
build_src_filter = +<*> -<height_servo_main.cpp> -<height_servo_bmi_main.cpp>
    -<servo_test.cpp> -<app_main.cpp>
