; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = yolo_uno_camera_lcd

[env:esp-wrover-kit]
platform = espressif32
board = esp-wrover-kit
framework = arduino
upload_speed = 921600
build_type = debug
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = 
	-std=gnu++17
	-DDEBUG
	-DCORE_DEBUG_LEVEL=3
lib_deps = h2zero/NimBLE-Arduino@^2.3.6

; Camera profile: UART2 belongs to camera; force ADCs overlap its GPIOs.
[env:yolo_uno_camera]
extends = env:yolo_uno_s3
build_flags =
    ${env:yolo_uno_s3.build_flags}
    -DCAMERA_ENABLED=1
    -DSCALE_ENABLE_QR=0
    -DSCALE_ENABLE_FORCE=0

; Wiring from AI_Vision_camera.ino: camera TX -> GPIO9; camera RX -> GPIO8.
[env:yolo_uno_camera_lcd]
extends = env:yolo_uno_camera
build_flags =
    ${env:yolo_uno_camera.build_flags}
    -DLCD_ENABLED=1
    -DCAMERA_RX_PIN=9
    -DCAMERA_TX_PIN=8
lib_deps =
    ${env:yolo_uno_s3.lib_deps}
    marcoschwartz/LiquidCrystal_I2C@1.1.4

; Temporary scanner: prints all BLE addresses without connecting to a scale.
[env:yolo_uno_ble_scan]
extends = env:yolo_uno_s3
build_src_filter = -<*> +<ble_scanner.cpp>
build_flags =
    ${env:yolo_uno_s3.build_flags}
    -DBLE_SCANNER_MODE=1

; Preflight for on-device inference. This does not run a model or change NVS.
[env:yolo_uno_edge_probe]
extends = env:yolo_uno_s3
build_src_filter = -<*> +<edge_probe.cpp>
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
build_flags =
    ${env:yolo_uno_s3.build_flags}
    -DBOARD_HAS_PSRAM
    -DEDGE_PROBE_MODE=1
lib_deps =

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_type = debug
upload_speed = 921600
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = 
	-std=gnu++17
	-DDEBUG
	-DCORE_DEBUG_LEVEL=3
lib_deps = h2zero/NimBLE-Arduino@^2.3.6

[env:yolo_uno_s3]
platform = espressif32
board = yolo_uno
framework = arduino
monitor_speed = 115200
; Framework adds level 0 after project flags; remove it so INFO logs stay on.
build_unflags = -DCORE_DEBUG_LEVEL=0

build_flags = 
	-std=gnu++17
	-DDEBUG
	-DCORE_DEBUG_LEVEL=3
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps = h2zero/NimBLE-Arduino@^2.3.6
