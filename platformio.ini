; TV2 BLE diagnostics for YOLO UNO.
; Integrated Edge AI firmware is built separately with firmware/edge_yolo/build.ps1.

[platformio]
default_envs = yolo_uno_ble_scan

; Shared board settings, not an executable environment in Project Tasks.
[yolo_uno_base]
platform = espressif32
board = yolo_uno
framework = arduino
monitor_speed = 115200
build_unflags = -DCORE_DEBUG_LEVEL=0
build_flags =
    -std=gnu++17
    -DDEBUG
    -DCORE_DEBUG_LEVEL=3
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps = h2zero/NimBLE-Arduino@^2.3.6

; Decodes the selected scale's advertisements without a GATT connection.
[env:yolo_uno_ble_scan]
extends = yolo_uno_base
build_src_filter = -<*> +<ble_scanner.cpp>
build_flags =
    ${yolo_uno_base.build_flags}
    -DBLE_SCANNER_MODE=1
    ; NimBLE Arduino prints directly to console: keep only errors.
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=1

; Standalone MG995 test on the D11 G/5V/S header (GPIO38).
[env:yolo_uno_servo_test]
extends = yolo_uno_base
build_src_filter = -<*> +<servo_mg995_test.cpp>
lib_deps =
lib_ignore = BLE, Config, Display, Measurements, Scale
