<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cấu hình WiFi</title><style>
body{font-family:'Segoe UI',sans-serif;background:#0f172a;color:#f8fafc;text-align:center;margin:0;padding:20px}
.box{max-width:400px;margin:5vh auto;background:#1e293b;padding:24px;border-radius:14px;border-top:4px solid #38bdf8}
h1{color:#38bdf8;font-size:1.4em;margin:0 0 14px}
input{width:100%;padding:12px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff;margin-bottom:12px;box-sizing:border-box}
.btn{width:100%;padding:12px;border:0;border-radius:8px;background:#38bdf8;color:#0f172a;font-weight:bold;font-size:15px;cursor:pointer}
.btn2{background:#334155;color:#e2e8f0;margin-bottom:8px}
#list{text-align:left;max-height:240px;overflow-y:auto;margin-bottom:12px}
.it{display:flex;align-items:center;gap:8px;padding:10px;border-radius:8px;background:#0f172a;border:1px solid #334155;margin-bottom:6px;cursor:pointer}
.it:hover{border-color:#38bdf8}
.it .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .b{color:#38bdf8;font-size:13px;letter-spacing:1px}
.hint{font-size:12px;color:#94a3b8;margin:4px 0 10px}
</style></head><body>
<div class="box"><h1>Cấu hình Wi-Fi</h1>
<button class="btn btn2" onclick="scan(true)">Quét lại</button>
<div class="hint" id="st">Đang quét...</div>
<div id="list"></div>
<form action="/save_wifi" method="POST">
<input id="ssid" name="ssid" placeholder="Tên Wi-Fi (SSID)" required>
<input id="pass" type="password" name="pass" placeholder="Mật khẩu">
<button class="btn" type="submit">KẾT NỐI</button></form></div>
<script>
function bars(r){return r>=-55?'****':r>=-65?'***':r>=-75?'**':'*';}
function pick(s){document.getElementById('ssid').value=s;
 document.getElementById('st').textContent='Đã chọn: '+s;
 document.getElementById('pass').focus();}
function scan(fresh){var st=document.getElementById('st'),L=document.getElementById('list');
 st.textContent='Đang quét...';if(fresh)L.innerHTML='';
 fetch('/scan'+(fresh?'?fresh=1':'')).then(function(r){return r.json()}).then(function(a){
  if(a&&a.busy){setTimeout(function(){scan(false)},400);return;}   // đang quét -> hỏi lại
  a.sort(function(x,y){return y.r-x.r});
  var tot=a.length; a=a.slice(0,10);   // chi hien 10 mang SONG MANH NHAT cho gon
  if(!tot){st.textContent='Không thấy mạng nào — bấm Quét lại.';return;}
  st.textContent='Bấm vào tên mạng để chọn';
  a.forEach(function(w){var d=document.createElement('div');d.className='it';
   d.onclick=function(){pick(w.s)};
   d.innerHTML='<span class="n"></span><span class="b">'+bars(w.r)+'</span><span>'+(w.e?'&#128274;':'')+'</span>';
   d.querySelector('.n').textContent=w.s;L.appendChild(d);});
 }).catch(function(){st.textContent='Quét lỗi — bấm Quét lại.';});}
scan(false);
</script></body></html>
